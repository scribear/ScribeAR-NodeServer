name: 'Coverage Report'
description: 'Checks out the repo and installs dependencies for node packages.'
inputs:
  # Inputs are the same as the arguments for irongut/CodeCoverageSummary@v1.3.0
  # All except of packages_name and filename have default values
  package_name:
     description: ''
     required: true
  filename:
    description: ''
    required: true
  badge:
    description: ''
    default: 'true'
  fail_below_min:
    description: ''
    default: 'false'
  format:
    description: ''
    default: markdown
  hide_branch_rate:
    description: ''
    default: 'false'
  hide_complexity:
    description: ''
    default: 'false'
  indicators: 
    description: ''
    default: 'true'
  output: 
    description: ''
    default: both
  thresholds: 
    description: ''
    default: '50 75'
runs:
  using: "composite"
  steps:
    - name: Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: ${{ inputs.filename }}
        badge: ${{ inputs.badge == 'true' }}
        fail_below_min: ${{ inputs.fail_below_min == 'true' }}
        format: ${{ inputs.format }}
        hide_branch_rate: ${{ inputs.hide_branch_rate == 'true' }}
        hide_complexity: ${{ inputs.hide_complexity == 'true' }}
        indicators: ${{ inputs.indicators == 'true' }}
        output: ${{ inputs.output }}
        thresholds: ${{ inputs.thresholds }}
        
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        header: ${{ inputs.package_name }}
        recreate: true
        path: code-coverage-results.md
