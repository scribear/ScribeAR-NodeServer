name: node-server CI

on:
  push:
    paths:
      - apps/*
      - libs/*
    branches:
      - main
      - staging
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: 24
  DOCKERHUB_ORG: "scribear"

jobs:
  lint-build-test-node:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: "."
        run: npm ci

      - name: Check formatting
        working-directory: "."
        run: npm run format

      - name: Run linter
        working-directory: "."
        run: npm run lint

      - name: Run build
        working-directory: "."
        run: npm run build

      - name: Run tests
        working-directory: "."
        run: npm run test
    
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "./@(apps|libs)/*/coverage/cobertura-coverage.xml"
          badge: true,
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: "50 75"

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

  build-session-manager-container:
    needs: lint-build-test-node
    runs-on: ubuntu-latest
    env:
      CONTAINER_NAME: "session-manager"
      BUILD_CONTEXT: "."
      DOCKERFILE: "./apps/session-manager/Dockerfile"
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_ORG }}/${{ env.CONTAINER_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: "linux/amd64"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_ORG }}/${{ env.CONTAINER_NAME }}:buildcache-linux-amd64
          cache-to: type=registry,ref=${{ env.DOCKERHUB_ORG }}/${{ env.CONTAINER_NAME }}:buildcache-linux-amd64,mode=max
          build-args: |
            BRANCH=${{ steps.meta.outputs.version }}
            BUILDNUMBER=${{ github.run_number }}
            ARG GITSHA1=${{ github.sha }}

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: "linux/arm64"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_ORG }}/${{ env.CONTAINER_NAME }}:buildcache-linux-arm64
          cache-to: type=registry,ref=${{ env.DOCKERHUB_ORG }}/${{ env.CONTAINER_NAME }}:buildcache-linux-arm64,mode=max
          build-args: |
            BRANCH=${{ steps.meta.outputs.version }}
            BUILDNUMBER=${{ github.run_number }}
            ARG GITSHA1=${{ github.sha }}
